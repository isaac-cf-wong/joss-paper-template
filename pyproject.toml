[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "joss-paper-template"
description = "A template repository for JOSS papers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
dynamic = ["version"]

[dependency-groups]
dev = ["prek>=0.4.0"]
release = ["git-cliff>=2.13.1"]

[tool.uv-dynamic-versioning]
vcs = "git"      # default
style = "semver" # or pep440, semver, etc.

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/joss_paper_template"]
